<!DOCTYPE html> <!-- Indica al navegador que este documento usa HTML5. -->
<html lang='es'> <!-- Abre el documento y declara que su idioma es español. -->
<head> <!-- Contiene configuraciones que no aparecen como contenido de la página. -->
    <meta charset='utf-8'> <!-- Permite mostrar correctamente tildes, ñ y otros caracteres. -->
    <meta name='viewport' content='width=device-width, initial-scale=1'> <!-- Adapta el ancho de la página a la pantalla del dispositivo. -->
    <meta name='description' content='Perfil personal de Juan Manuel Uribe Alvarez.'> <!-- Ofrece una descripción breve de la página a buscadores. -->
    <title>Perfil | Juan Manuel Uribe Alvarez</title> <!-- Define el texto que aparece en la pestaña del navegador. -->
    <link rel='stylesheet' href='styles.css'> <!-- Conecta esta página con el archivo que contiene sus estilos. -->
</head> <!-- Cierra la sección de configuración. -->
<body> <!-- Abre la parte visible de la página. -->
    <main class="profile"> <!-- Agrupa el contenido principal; la clase permite aplicarle estilos CSS. -->
        <header class="profile__header"> <!-- Agrupa la presentación inicial del perfil. -->
            <p class="profile__eyebrow">Perfil personal</p> <!-- Muestra un texto breve destacado sobre el título. -->
            <h1>Juan Manuel Uribe Alvarez</h1> <!-- Muestra el título principal de la página. -->
            <p class="profile__intro">Soy conductor y quiero ser el mejor programador.</p> <!-- Muestra la presentación personal. -->
            <ul class="profile__roles" aria-label="Ocupaciones e intereses"> <!-- Agrupa las ocupaciones y sus iconos para identificarlas rápidamente. -->
                <li><span aria-hidden="true">🚗</span> Conductor</li> <!-- Muestra el icono del carro y el texto accesible de la ocupación. -->
                <li><span aria-hidden="true">💻</span> Programador</li> <!-- Muestra el icono del computador y el texto accesible del interés. -->
            </ul> <!-- Cierra la lista de ocupaciones e intereses. -->
        </header> <!-- Cierra la cabecera del perfil. -->

        <section class="profile__section" aria-labelledby="contact-heading"> <!-- Abre la sección de contacto; la referencia ayuda a lectores de pantalla. -->
            <header> <!-- Abre la cabecera de la sección de contacto. -->
                <h2 id="contact-heading">Contacto</h2> <!-- Muestra el título y le da el identificador referido arriba. -->
            </header> <!-- Cierra la cabecera de la sección de contacto. -->
            <ul> <!-- Agrupa las formas directas de contacto. -->
                <li><a href="tel:3101234567">310 123 4567</a></li> <!-- Permite llamar desde dispositivos compatibles. -->
                <li><a href="mailto:uribe@iclud.com">uribe@iclud.com</a></li> <!-- Permite enviar un mensaje de correo electrónico. -->
            </ul> <!-- Cierra la lista de contacto. -->
        </section> <!-- Cierra la sección de contacto. -->

        <section class="profile__section" aria-labelledby="technology-heading"> <!-- Abre la sección de tecnologías y la relaciona con su título accesible. -->
            <h2 id="technology-heading">Tecnologías</h2> <!-- Muestra el título de la sección y define su identificador único. -->
            <ul class="technology-list"> <!-- Abre una lista sin numeración; la clase permite darle estilos. -->
                <li>Visual Studio Code</li> <!-- Añade Visual Studio Code como elemento de la lista. -->
                <li>OpenAI</li> <!-- Añade OpenAI como elemento de la lista. -->
                <li>HTML</li> <!-- Añade HTML como elemento de la lista. -->
                <li>CSS</li> <!-- Añade CSS como elemento de la lista. -->
                <li>GitHub</li> <!-- Añade GitHub como elemento de la lista. -->
                <li>IA</li> <!-- Añade IA como elemento de la lista. -->
            </ul> <!-- Cierra la lista de tecnologías. -->
        </section> <!-- Cierra la sección de tecnologías. -->
    </main> <!-- Cierra el contenido principal. -->
</body> <!-- Cierra la parte visible de la página. -->
</html> <!-- Cierra el documento HTML. -->
